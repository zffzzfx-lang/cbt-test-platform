<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Test Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .container{background:#fff;border-radius:20px;padding:30px;width:500px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
        h2{text-align:center;color:#1e293b;margin-bottom:20px}
        .role-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
        .role-btn{padding:15px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;cursor:pointer;font-weight:600;background:#fff}
        .role-btn.active{border-color:#6366f1;background:#e0e7ff}
        input,select,textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:10px 0;font-size:16px;font-family:inherit}
        .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin:8px 0}
        .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .btn-danger{background:#ef4444;color:#fff}
        .card{background:#f8fafc;padding:20px;border-radius:10px;margin:10px 0}
        .option{padding:12px;border:2px solid #e2e8f0;border-radius:8px;margin:5px 0;cursor:pointer;transition:.3s}
        .option:hover{border-color:#6366f1;background:#f0f1ff}
        .option.selected{border-color:#6366f1;background:#6366f1;color:#fff}
        .timer{background:#ef4444;color:#fff;padding:8px 16px;border-radius:20px;font-weight:700}
        .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}
        .stat{background:#f8fafc;padding:15px;border-radius:10px;text-align:center}
        .stat-val{font-size:28px;font-weight:700;margin:5px 0}
        canvas{width:100%!important;max-height:250px}
        table{width:100%;border-collapse:collapse;margin:10px 0}
        th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0}
        .badge{display:inline-block;padding:3px 10px;border-radius:15px;font-weight:700;font-size:12px}
        .badge-1{background:#ffd700;color:#000}
        .badge-2{background:#c0c0c0;color:#000}
        .badge-3{background:#cd7f32;color:#fff}
        .correct{color:#10b981}
        .wrong{color:#ef4444}
    </style>
</head>
<body>
<div id="app"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// State
let S={role:'admin',user:null,test:null,questions:[],answers:{},curQ:0,timer:null,timeLeft:0,startTime:null};

// Database
let db;
const DB_REQ=indexedDB.open('CBT_DB',1);
DB_REQ.onupgradeneeded=e=>{
    db=e.target.result;
    if(!db.objectStoreNames.contains('tests')) db.createObjectStore('tests',{keyPath:'id',autoIncrement:true});
    if(!db.objectStoreNames.contains('results')) db.createObjectStore('results',{keyPath:'id',autoIncrement:true});
    if(!db.objectStoreNames.contains('students')) db.createObjectStore('students',{keyPath:'rollNo'});
};
DB_REQ.onsuccess=e=>{db=e.target.result;renderLogin()};
DB_REQ.onerror=()=>alert('Database error! Please allow storage.');

function dbAdd(store,data){return new Promise(r=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).add(data);req.onsuccess=()=>r(req.result)})}
function dbAll(store){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>r(req.result)})}
function dbGet(store,id){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(id);req.onsuccess=()=>r(req.result)})}

// Sample questions
function sampleQ(){return[{id:1,q:"What is 2+2?",opts:["3","4","5","6"],ans:"4"},{id:2,q:"Capital of India?",opts:["Mumbai","Delhi","Kolkata","Chennai"],ans:"Delhi"},{id:3,q:"Red Planet?",opts:["Venus","Mars","Jupiter","Saturn"],ans:"Mars"},{id:4,q:"Largest Ocean?",opts:["Atlantic","Indian","Arctic","Pacific"],ans:"Pacific"},{id:5,q:"H2O is?",opts:["Oxygen","Water","Salt","Sugar"],ans:"Water"}]}

// Render
function R(html){document.getElementById('app').innerHTML=html}

// Login Screen
async function renderLogin(){
    const tests=await dbAll('tests');
    if(tests.length===0){await dbAdd('tests',{name:'Sample Test',subject:'GK',duration:10,questions:sampleQ(),total:5,createdAt:new Date().toISOString()})}
    const freshTests=await dbAll('tests');
    R(`
        <div class="container">
            <h2>📚 CBT Test Platform</h2>
            <div class="role-btns">
                <div class="role-btn ${S.role=='admin'?'active':''}" onclick="S.role='admin';renderLogin()">👨‍🏫 Admin</div>
                <div class="role-btn ${S.role=='student'?'active':''}" onclick="S.role='student';renderLogin()">👨‍🎓 Student</div>
            </div>
            ${S.role=='admin'?`
                <input id="aid" placeholder="Admin ID" value="admin123">
                <input id="apass" type="password" placeholder="Password" value="admin123">
                <button class="btn btn-primary" onclick="adminLogin()">🔑 Login as Admin</button>
            `:`
                <input id="sname" placeholder="Your Full Name">
                <input id="sroll" placeholder="Roll Number">
                <select id="stest">${freshTests.map(t=>`<option value="${t.id}">${t.name} - ${t.subject} (${t.duration}min)</option>`).join('')}</select>
                <button class="btn btn-primary" onclick="studentStart()">▶️ Start Test</button>
            `}
            <p style="text-align:center;margin-top:10px;color:#94a3b8;font-size:12px">Admin: admin123 / admin123</p>
        </div>
    `);
}

// Admin Login
function adminLogin(){
    const id=document.getElementById('aid').value,pass=document.getElementById('apass').value;
    if(id=='admin123'&&pass=='admin123'){S.user={role:'admin'};renderAdmin()}else alert('Wrong! Use admin123/admin123');
}

// Admin Panel
function renderAdmin(){
    R(`
        <div class="container" style="width:700px">
            <h2>📊 Admin Dashboard</h2>
            <button class="btn btn-primary" onclick="showUploadTest()">📤 Upload New Test</button>
            <button class="btn btn-primary" onclick="showAllResults()">📈 View All Results</button>
            <button class="btn btn-primary" onclick="showRankings()">🏆 Student Rankings</button>
            <button class="btn" onclick="S.user=null;S.role='admin';renderLogin()">🚪 Logout</button>
            <div id="adminArea" style="margin-top:15px"></div>
        </div>
    `);
}

function showUploadTest(){
    document.getElementById('adminArea').innerHTML=`
        <div class="card"><h3>📤 Upload Test</h3>
            <input id="tname" placeholder="Test Name (e.g. Math Mid-Term)">
            <input id="tsub" placeholder="Subject (e.g. Mathematics)">
            <input id="tdur" type="number" placeholder="Duration (minutes)" value="30">
            <label style="display:block;margin-top:10px">Upload Question PDF:</label>
            <input id="tpdf" type="file" accept=".pdf">
            <label style="display:block;margin-top:10px">Answer Key (format: 1:A, 2:B, 3:C)</label>
            <textarea id="tkey" rows="3" placeholder="1:A, 2:B, 3:C"></textarea>
            <button class="btn btn-primary" onclick="processUpload()">🔄 Process & Upload</button>
            <div id="upStatus" style="margin-top:10px"></div>
        </div>
    `;
}

async function processUpload(){
    const name=document.getElementById('tname').value,sub=document.getElementById('tsub').value;
    const dur=parseInt(document.getElementById('tdur').value),file=document.getElementById('tpdf').files[0];
    const keyTxt=document.getElementById('tkey').value,st=document.getElementById('upStatus');
    if(!name||!file){st.innerHTML='❌ Fill all fields & select PDF';return}
    st.innerHTML='⏳ Processing PDF...';
    try{
        const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise;
        let text='';
        for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const c=await p.getTextContent();text+=c.items.map(it=>it.str).join(' ')+'\n'}
        const lines=text.split('\n').filter(l=>l.trim());
        let qs=[],cur=null;
        for(let l of lines){l=l.trim();
            if(/^\d+[.)]\s/.test(l)){if(cur&&cur.opts.length>=2)qs.push(cur);cur={id:qs.length+1,q:l.replace(/^\d+[.)]\s*/,''),opts:[],ans:null}}
            else if(/^[A-D][.)]\s/.test(l)&&cur)cur.opts.push(l.replace(/^[A-D][.)]\s*/,''));
        }
        if(cur&&cur.opts.length>=2)qs.push(cur);
        if(keyTxt){const pairs=keyTxt.split(/[,;\n]+/);pairs.forEach(p=>{const m=p.trim().match(/(\d+)\s*[:=]\s*([A-D])/i);if(m&&qs[parseInt(m[1])-1]){const idx=m[2].toUpperCase().charCodeAt(0)-65;qs[parseInt(m[1])-1].ans=qs[parseInt(m[1])-1].opts[idx]}})}
        if(qs.length===0)qs=sampleQ();
        await dbAdd('tests',{name,subject:sub,duration:dur,questions:qs,total:qs.length,createdAt:new Date().toISOString()});
        st.innerHTML=`✅ Success! ${qs.length} questions uploaded.`;
        document.getElementById('tname').value='';document.getElementById('tsub').value='';document.getElementById('tkey').value='';document.getElementById('tpdf').value='';
    }catch(e){st.innerHTML='❌ Error: '+e.message}
}

async function showAllResults(){
    const results=await dbAll('results');
    document.getElementById('adminArea').innerHTML=results.length===0?'<p>No results yet.</p>':`
        <div class="card"><h3>📈 All Results (${results.length})</h3>
            <table><thead><tr><th>Student</th><th>Roll</th><th>Test</th><th>Score</th><th>Time</th><th>Date</th></tr></thead><tbody>
                ${results.map(r=>`<tr><td>${r.sname}</td><td>${r.sroll}</td><td>${r.tname}</td><td><b>${r.pct}%</b></td><td>${Math.floor(r.time/60)}m ${r.time%60}s</td><td>${new Date(r.date).toLocaleDateString()}</td></tr>`).join('')}
            </tbody></table></div>`;
}

async function showRankings(){
    const tests=await dbAll('tests'),results=await dbAll('results');
    let html='';
    for(let t of tests){const tr=results.filter(r=>r.testId===t.id).sort((a,b)=>b.pct-a.pct);
        html+=`<div class="card"><h4>🏆 ${t.name} (${t.subject})</h4><table><thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Time</th></tr></thead><tbody>`;
        tr.slice(0,10).forEach((r,i)=>{html+=`<tr><td><span class="badge ${i<3?'badge-'+(i+1):''}">#${i+1}</span></td><td>${r.sname} (${r.sroll})</td><td><b>${r.pct}%</b></td><td>${Math.floor(r.time/60)}m ${r.time%60}s</td></tr>`});
        html+='</tbody></table></div>'}
    document.getElementById('adminArea').innerHTML=html||'<p>No data</p>';
}

// Student Test
async function studentStart(){
    const name=document.getElementById('sname').value,roll=document.getElementById('sroll').value,testId=parseInt(document.getElementById('stest').value);
    if(!name||!roll)return alert('Fill all fields');
    await dbAdd('students',{rollNo:roll,name:name,lastActive:new Date().toISOString()});
    S.test=await dbGet('tests',testId);S.user={role:'student',name,rollNo:roll};S.questions=S.test.questions;S.answers={};S.curQ=0;S.timeLeft=S.test.duration*60;S.startTime=Date.now();
    renderTest();
}

function renderTest(){
    R(`
        <div style="width:100vw;height:100vh;background:#fff;display:flex;flex-direction:column">
            <div style="background:#1e293b;color:#fff;padding:12px 25px;display:flex;justify-content:space-between;align-items:center">
                <div><b>${S.test.name}</b><br><small>${S.user.name} | ${S.user.rollNo}</small></div>
                <div class="timer" id="timerDisp">${fmtTime(S.timeLeft)}</div>
                <button class="btn btn-danger" style="width:auto;padding:10px 20px" onclick="submitTest()">📝 Submit</button>
            </div>
            <div style="display:flex;flex:1;overflow:hidden">
                <div style="flex:1;padding:25px;overflow-y:auto" id="qArea"></div>
                <div style="width:260px;background:#f8fafc;padding:15px;border-left:1px solid #e2e8f0;overflow-y:auto">
                    <h4>Question Palette</h4>
                    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0" id="qGrid"></div>
                    <div style="font-size:11px;margin-top:10px">🟦 Answered | 🟪 Current | ⬜ Not Visited</div>
                </div>
            </div>
        </div>
    `);
    showQ();
    S.timer=setInterval(()=>{S.timeLeft--;const td=document.getElementById('timerDisp');if(td)td.textContent=fmtTime(S.timeLeft);if(S.timeLeft<=0){clearInterval(S.timer);submitTest()}},1000);
}

function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`}

function showQ(){
    const q=S.questions[S.curQ],area=document.getElementById('qArea');if(!area)return;
    area.innerHTML=`
        <h3 style="margin-bottom:5px">Question ${S.curQ+1} of ${S.questions.length}</h3>
        <div style="background:#f1f5f9;padding:20px;border-radius:10px;margin-bottom:15px"><p style="font-size:18px">${q.q}</p></div>
        ${q.opts.map((o,i)=>`<div class="option ${S.answers[S.curQ]===i?'selected':''}" onclick="selectOpt(${i})"><b>${String.fromCharCode(65+i)}.</b> ${o}</div>`).join('')}
        <div style="display:flex;gap:10px;margin-top:20px">
            <button class="btn btn-primary" style="width:auto" onclick="S.curQ--;showQ()" ${S.curQ===0?'disabled':''}>◀ Prev</button>
            <button class="btn btn-primary" style="width:auto" onclick="S.curQ++;showQ()" ${S.curQ===S.questions.length-1?'disabled':''}>Next ▶</button>
        </div>`;
    const grid=document.getElementById('qGrid');if(grid)grid.innerHTML=S.questions.map((_,i)=>`<div onclick="S.curQ=${i};showQ()" style="aspect-ratio:1;border:2px solid ${i===S.curQ?'#6366f1':S.answers[i]!==undefined?'#3b82f6':'#e2e8f0'};border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:13px;background:${i===S.curQ?'#6366f1':S.answers[i]!==undefined?'#dbeafe':'#fff'};color:${i===S.curQ?'#fff':'#1e293b'}">${i+1}</div>`).join('');
}

function selectOpt(i){S.answers[S.curQ]=i;showQ()}

async function submitTest(){
    clearInterval(S.timer);
    if(!confirm('Submit test? You cannot change answers after this.')){S.timer=setInterval(()=>{S.timeLeft--;const td=document.getElementById('timerDisp');if(td)td.textContent=fmtTime(S.timeLeft);if(S.timeLeft<=0){clearInterval(S.timer);submitTest()}},1000);return}
    const timeTaken=Math.floor((Date.now()-S.startTime)/1000);
    let correct=0,incorrect=0,unattempted=0;
    S.questions.forEach((q,i)=>{if(S.answers[i]===undefined)unattempted++;else if(q.opts[S.answers[i]]===q.ans)correct++;else incorrect++});
    const pct=parseFloat(((correct/S.questions.length)*100).toFixed(1));
    const result={testId:S.test.id,tname:S.test.name,sname:S.user.name,sroll:S.user.rollNo,correct,incorrect,unattempted,pct,time:timeTaken,date:new Date().toISOString(),details:S.questions.map((q,i)=>({q:q.q,userAns:S.answers[i]!==undefined?q.opts[S.answers[i]]:'Not Attempted',correctAns:q.ans,isCorrect:S.answers[i]!==undefined&&q.opts[S.answers[i]]===q.ans}))};
    await dbAdd('results',result);
    const allRes=(await dbAll('results')).filter(r=>r.testId===S.test.id).sort((a,b)=>b.pct-a.pct);
    const rank=allRes.findIndex(r=>r.sroll===S.user.rollNo)+1;
    showResults(result,rank,allRes);
}

function showResults(result,rank,allRes){
    R(`
        <div class="container" style="width:750px">
            <h2>✅ Test Completed!</h2>
            <div style="text-align:center;font-size:56px;font-weight:800;color:#6366f1;margin:15px 0">${result.pct}%</div>
            <p style="text-align:center">🏅 Your Rank: <b>#${rank}</b> of ${allRes.length} | ⏱️ Time: ${Math.floor(result.time/60)}m ${result.time%60}s</p>
            <div class="stats">
                <div class="stat"><div class="stat-val correct">${result.correct}</div>✅ Correct</div>
                <div class="stat"><div class="stat-val wrong">${result.incorrect}</div>❌ Incorrect</div>
                <div class="stat"><div class="stat-val" style="color:#f59e0b">${result.unattempted}</div>⚪ Unattempted</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:15px 0">
                <div class="card"><h4>Score Distribution</h4><canvas id="chart1"></canvas></div>
                <div class="card"><h4>Performance</h4><canvas id="chart2"></canvas></div>
            </div>
            <div class="card"><h3>🏆 Leaderboard</h3>
                <table><thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Time</th></tr></thead><tbody>
                    ${allRes.slice(0,5).map((r,i)=>`<tr ${r.sroll===result.sroll?'style="background:#e0e7ff"':''}><td><span class="badge ${i<3?'badge-'+(i+1):''}">#${i+1}</span></td><td>${r.sname}</td><td><b>${r.pct}%</b></td><td>${Math.floor(r.time/60)}m ${r.time%60}s</td></tr>`).join('')}
                </tbody></table>
            </div>
            <div class="card"><h3>📋 Detailed Answers</h3>
                ${result.details.map((d,i)=>`<div style="padding:10px;margin:5px 0;border-left:4px solid ${d.isCorrect?'#10b981':'#ef4444'};background:#f8fafc"><b>Q${i+1}:</b> ${d.q}<br><small>Your Answer: <span class="${d.isCorrect?'correct':'wrong'}">${d.userAns}</span> | Correct: <span class="correct">${d.correctAns||'N/A'}</span></small></div>`).join('')}
            </div>
            <button class="btn btn-primary" onclick="S.user=null;S.role='student';renderLogin()">🏠 Back to Login</button>
        </div>
    `);
    new Chart(document.getElementById('chart1'),{type:'doughnut',data:{labels:['Correct','Incorrect','Unattempted'],datasets:[{data:[result.correct,result.incorrect,result.unattempted],backgroundColor:['#10b981','#ef4444','#f59e0b']}]}});
    new Chart(document.getElementById('chart2'),{type:'bar',data:{labels:['Your Score'],datasets:[{data:[result.pct],backgroundColor:'#6366f1'}]},options:{scales:{y:{max:100}}}});
}
</script>
</body>
</html>
